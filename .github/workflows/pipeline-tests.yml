name: pipeline-tests
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r parser-engine/requirements.txt pytest
      - run: pytest -q tests/parser
      - run: python -m compileall -q ingestion pipeline-api parser-engine ai-parser parser-validator normalization template-engine enrichment correlation detection policy-engine audit

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config -q
