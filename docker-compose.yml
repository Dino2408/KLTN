name: ai-siem-soar

services:
  parser-engine:
    build:
      context: ./parser-engine
    container_name: ai-siem-parser-engine
    restart: unless-stopped
    volumes:
      - ./parsers/active:/app/parsers:rw
    networks: [pipeline_net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  ai-parser:
    build:
      context: ./ai-parser
    container_name: ai-siem-ai-parser
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5-coder:7b}
      PARSER_DIR: /app/parsers
    volumes:
      - ./parsers/candidates:/app/parsers:rw
    depends_on:
      ollama:
        condition: service_started
    networks: [pipeline_net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  normalization:
    build:
      context: ./normalization
    container_name: ai-siem-normalization
    restart: unless-stopped
    networks: [pipeline_net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  ai-gateway:
    build:
      context: ./ai-gateway
    container_name: ai-siem-ai-gateway
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5-coder:7b}
      AI_MAX_EVENTS: ${AI_MAX_EVENTS:-50}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.90}
      SHUFFLE_WEBHOOK_URL: ${SHUFFLE_WEBHOOK_URL:-}
    ports:
      - "${AI_GATEWAY_PORT:-8080}:8080"
    depends_on:
      ollama:
        condition: service_started
    networks: [pipeline_net, soar_bridge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  ollama:
    image: ollama/ollama:latest
    container_name: ai-siem-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    networks: [pipeline_net]
    security_opt: [no-new-privileges:true]
    gpus: all

networks:
  pipeline_net:
    driver: bridge
    internal: true
  soar_bridge:
    driver: bridge
    internal: true

volumes:
  ollama_data:
