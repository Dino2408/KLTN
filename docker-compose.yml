name: ai-siem-soar

services:
  ai-gateway:
    build:
      context: ./ai-gateway
    container_name: ai-siem-ai-gateway
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5-coder:7b}
      AI_MAX_EVENTS: ${AI_MAX_EVENTS:-50}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.90}
      SHUFFLE_WEBHOOK_URL: ${SHUFFLE_WEBHOOK_URL:-}
    ports:
      - "${AI_GATEWAY_PORT:-8080}:8080"
    depends_on:
      ollama:
        condition: service_started
    networks:
      - ai_net
      - soar_bridge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    container_name: ai-siem-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    networks:
      - ai_net
    security_opt:
      - no-new-privileges:true
    gpus: all

  suricata:
    image: jasonish/suricata:latest
    container_name: ai-siem-suricata
    restart: unless-stopped
    command: ["suricata", "-i", "eth0", "-l", "/var/log/suricata"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules:/var/lib/suricata/rules:ro
      - ./data/suricata:/var/log/suricata
    networks:
      - siem_ingest
    profiles:
      - network

networks:
  ai_net:
    driver: bridge
    internal: true
  soar_bridge:
    driver: bridge
    internal: true
  siem_ingest:
    driver: bridge

volumes:
  ollama_data:
